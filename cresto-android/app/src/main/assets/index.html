  <style>

;font-size:11px;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #dbe5e1;background:#fafcfb;border-radius:12px;padding:12px;color:#223c42;outline:none;min-height:42px}input:focus,select:focus,textarea:focus{border-color:#1b9a8b;box-shadow:0 0 0 3px #1b9a8b16}textarea{min-height:78px;resize:vertical}.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f0}.list-item:last-child{border-bottom:0;padding-bottom:0}.list-icon{width:36px;height:36px;border-radius:12px;background:#edf6f1;display:grid;place-items:center;font-size:19px;flex:none}.list-title{font-size:12px;font-weight:800}.list-sub{font-size:10px;color:#82949a;line-height:1.5;margin-top:3px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:470px;width:100%;height:calc(69px + env(safe-area-inset-bottom, 0px));padding:6px 10px env(safe-area-inset-bottom,0px);background:#fff;display:flex;justify-content:space-around;border-top:1px solid #e4ece9;box-shadow:0 -4px 24px #113a3810;z-index:20}.nav-link{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:4px;border:0;background:transparent;color:#8ca2a1;font-size:10px;font-weight:800;min-width:58px}.nav-link span{font-size:23px;line-height:1.15}.nav-link.active{color:#0a7c70}.nav-link.active span{background:#e2f8ed;border-radius:10px;padding:3px 13px;margin:-3px -13px}.topbar{padding:18px 21px 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.topbar h1{font-size:17px;margin:1px 0;letter-spacing:-.3px}.topbar button{border:0;background:#f0f7f4;width:37px;height:37px;border-radius:10px;font-size:16px}.badge{background:#f0f6f3;color:#53776d;border-radius:50px;padding:4px 8px;font-size:9px;font-weight:850}.pass{padding:22px;border-radius:23px;background:linear-gradient(130deg,#102c3b,#0e695f);color:#fff;overflow:hidden;position:relative}.pass:after{content:'';position:absolute;right:-80px;top:-100px;width:230px;height:230px;border:30px solid #ffffff08;border-radius:50%}.pass-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:31px}.pass h3{font-size:22px;letter-spacing:1px;margin:0 0 10px}.qr{width:110px;height:110px;border:6px solid white;border-radius:6px;background:white;display:grid;grid-template-columns:repeat(17,1fr);gap:1px;padding:3px}.qr i{background:#112f35}.pass-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.empty{text-align:center;padding:35px 16px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:15px}.modal-wrap{position:fixed;inset:0;background:#041d27aa;z-index:40;display:flex;justify-content:center;align-items:flex-end;padding:0 0 env(safe-area-inset-bottom,0px)}.modal{width:min(100%,470px);max-height:85dvh;overflow-y:auto;border-radius:23px 23px 0 0;padding:25px 21px 28px;background:#fff;box-shadow:0 0 50px #0002}.modal h2{font-size:19px;margin:0 0 16px}.role-option{display:flex;gap:13px;align-items:center;text-align:left;width:100%;background:#f8fbf9;border:1px solid #e4efea;padding:15px;margin:8px 0;border-radius:15px}.role-option .emo{font-size:25px}.role-option .name{font-weight:850}.role-option .desc{font-size:11px;color:var(--muted);margin-top:2px}.inline-note{padding:10px 12px;background:#fff4dd;border-radius:10px;color:#91631a;font-size:10px;line-height:1.5;border:1px solid #ffebbc}.stack{display:flex;flex-direction:column;gap:10px}.right{text-align:right}.text-btn{border:0;background:transparent;color:#0a8074;font-size:11px;font-weight:850;padding:5px}.mini-progress{height:7px;background:#e9f0ed;border-radius:10px;overflow:hidden;margin:9px 0}.mini-progress>div{height:100%;background:#30a493;border-radius:10px}.money{font-size:27px;font-weight:950;letter-spacing:-.5px}.search-title{font-size:13px;font-weight:850;margin-bottom:5px}.no-margin{margin:0}.mb{margin-bottom:14px}.mt{margin-top:1 <body>
 <div id="app" role="application" aria-label="CRESTO reference app"></div>
 <div id="toast" aria-live="polite"></div>
 <script>
/* CRESTO interactive OFFLINE reference. Not connected to real vehicles or passengers. */
(() => {
  'use strict';
  const STORAGE='cresto_reference_state_v2';
  const STOPS=[
    {name:'Main Bus Stand',time:'08:05',x:52,y:194},
    {name:'Railway Junction',time:'08:20',x:126,y:160},
    {name:'City Library',time:'08:35',x:205,y:117},
    {name:'University Gate',time:'08:45',x:282,y:84},
    {name:'Campus Transport Hub',time:'08:55',x:335,y:39}
  ];
  const TODAY=()=>new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const CLOCK=()=>new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  const timeStamp=()=>new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
  const esc=(val)=>String(val??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=(v)=>'₹'+Number(v||0).toLocaleString('en-IN');
  const seed=()=>({
    role:'Student', tab:'home', bus:'MH-09-CB-1427', extraBuses:[],route:'City Express — Route 01', trip:false,step:0,lastUpdate:null,
    trips:[], drivers:[{name:'Rajesh Patil',contact:'Demo driver'}],
    enrollments:[{id:'ENR-0001',name:'Aarav Mehta',role:'Student',stop:1,status:'Approved',fee:8400,paid:4200},
      {id:'ENR-0002',name:'Dr. Neha Joshi',role:'Faculty',stop:2,status:'Pending',fee:8400,paid:0}],
    notifications:[{id:1,txt:'Welcome to CRESTO! This is a sample-data reference application.',date:'Demo message',type:'info'}],
    maintenance:[{id:1,txt:'Pre-trip inspection completed',date:'Sample record'}],
    emergencies:[], payments:[{id:'PAY-0001',enrollment:'ENR-0001',amount:4200,date:'Sample payment',method:'Manual record'}],
    routeFee:8400,simulate:true
  });
  let state;
  try { state=JSON.parse(localStorage.getItem(STORAGE))||seed(); } catch {state=seed();}
  if(!state||!Array.isArray(state.enrollments)) state=seed();
  // Navigation and modal state are ephemeral, shared sample records are stored locally.
  let modal='', toastTimer=null;
  const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){console.warn('Storage unavailable',e)}};
  const enrollment=()=>state.enrollments.find(x=>x.role===state.role);
  const approvedCount=()=>state.enrollments.filter(x=>x.status==='Approved').length;
  const seatCapacity=()=>42;
  const nextStop=()=>STOPS[Math.min(state.step+1,STOPS.length-1)];
  const remaining=()=>Math.max(0,STOPS.length-1-state.step)*8;
  const addNotice=(txt,type='info')=>{state.notifications.unshift({id:Date.now()+Math.random(),txt,date:timeStamp(),type});save();};
  const flash=(message)=>{const box=document.getElementById('toast');box.textContent=message;box.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),2600)};
  const initialForRole=r=>({Student:'AM',Faculty:'NJ',Driver:'RP',Admin:'TA'}[r]||'CR');
  const profileName=()=>({Student:'Aarav Mehta',Faculty:'Dr. Neha Joshi',Driver:'Rajesh Patil',Admin:'Transport Admin'}[state.role]);
  const isAdmin=()=>state.role==='Admin';
  const isDriver=()=>state.role==='Driver';
  const isPassenger=()=>state.role==='Student'||state.role==='Faculty';
  const statusChip=(status)=>`<span class="chip ${status==='Approved'||status==='Active'||status==='Paid'?'success':status==='Pending'?'warn':status==='Rejected'?'danger':''}">${esc(status)}</span>`;
  const tabNav=()=>{const tabs=(isAdmin()?[
    ['home','⌂','Overview'],['track','◎','Tracking'],['manage','☷','Manage'],['reports','▦','Reports']
  ]:isDriver()?[
    ['home','⌂','Overview'],['track','◎','My trip'],['alerts','♢','Updates'],['profile','◉','Profile']
  ]:[['home','⌂','Home'],['track','◎','Track'],['services','▦','Services'],['alerts','♢','Updates']]);
    return `<nav class="bottom" aria-label="Main navigation">${tabs.map(t=>`<button class="nav-link ${state.tab===t[0]?'active':''}" onclick="Cresto.nav('${t[0]}')"><span aria-hidden="true">${t[1]}</span>${t[2]}</button>`).join('')}</nav>`};
  const hero=(title,subtitle)=>`<header class="hero">
      <div class="brand"><div class="brand-left"><div class="mark">C</div><div><div class="brand-name">CRESTO</div><div class="tagline">CAMPUS TRANSPORT PLATFORM</div></div></div><button class="role" onclick="Cresto.modal('role')" aria-label="Switch demo user">${esc(state.role)} ▾</button></div>
      <span class="floating-demo">DEMO DATA</span><h1>${title}</h1><p>${subtitle}</p>
      <div class="status-row"><span class="status-pill"><i class="dot ${state.trip?'green':''}"></i>${state.trip?'Demo trip running':'No active trip'}</span><span class="status-pill">🚍 01 primary bus</span></div></header>`;
  const topbar=(title,subtitle)=>`<header class="topbar"><div><div class="overline" style="color:#73958f">${esc(subtitle||'CRESTO / DEMO')}</div><h1>${esc(title)}</h1></div><button onclick="Cresto.modal('role')" title="Switch demo user">${initialForRole(state.role)}</button></header>`;
  const section=(title,suffix='')=>`<div class="section-head"><h2>${title}</h2>${suffix}</div>`;
  const busCard=()=>`<div class="card"><div class="row between"><div class="row"><div class="bus-icon">🚌</div><div><div class="eyebrow">YOUR CAMPUS BUS</div><div class="bus-id">${esc(state.bus)}</div><div class="small muted">${esc(state.route)}</div></div></div>${statusChip(state.trip?'Active':'Parked')}</div><div class="divider"></div><div class="row between"><div><div class="small muted">Next stop</div><div class="bold" style="margin-top:4px">${state.trip?esc(nextStop().name):'Awaiting trip start'}</div></div><div class="right"><div class="small muted">ETA (demo)</div><div class="bold" style="margin-top:4px">${state.trip?remaining()+' min':'—'}</div></div></div></div>`;
  function home(){
    const admin=isAdmin(), driver=isDriver(), record=enrollment(), owed=record?Math.max(0,record.fee-record.paid):0;
    const title=admin?'Transport control center':driver?'Ready for your next trip?':'Your campus. On the move.';
    const subtitle=admin?'Manage transport operations from one place.':driver?'Start your demo trip and move the bus along its sample route.':'Routes, bus updates and your transport services — in one place.';
    let content=hero(title,subtitle)+'<main class="main">';
    if(admin){
      content+=section('At a glance',`<span class="small muted">${TODAY()}</span>`)+`<div class="metric-grid">
       ${metric('Buses',1+state.extraBuses.length,'🚌')}${metric('Approved riders',approvedCount(),'🎓')}${metric('Active trips',Number(state.trip),'📍')}${metric('Receipts',state.payments.length,'🧾')}
      </div>`+section('Live fleet')+busCard()+`<div class="actions"><button class="btn btn-primary half" onclick="Cresto.nav('manage')">Manage records →</button><button class="btn btn-outline half" onclick="Cresto.nav('reports')">View reports</button></div>`;
    } else if(driver){
      content+=section('Assigned vehicle',`<span class="chip success">Demo driver</span>`)+busCard()+`<div class="card dark-card"><div class="eyebrow" style="color:#d4f2e3">TRIP CONTROLS</div><div class="title">${state.trip?'Trip in progress':'Start your morning trip'}</div><p class="small" style="color:#d5edec;line-height:1.65">${state.trip?'Sample position updates every few seconds. No phone GPS is collected or shared.':'This reference simulates a trip locally on your phone.'}</p><div class="actions"><button class="btn btn-white half" onclick="Cresto.trip()">${state.trip?'■ End demo trip':'▶ Start demo trip'}</button><button class="btn btn-orange half" onclick="Cresto.modal('emergency')">⚠ Report issue</button></div></div>`+section('Trip history')+listTrip();
    } else {
      content+=section('Your ride today',`<span class="small muted">${TODAY()}</span>`)+busCard()+`<div class="metric-grid">${metric('Assigned stop',record&&record.status==='Approved'?STOPS[record.stop].name:'Not assigned','📍',true)}${metric('Seat availability',`${seatCapacity()-approvedCount()} seats`,'💺',true)}</div>`+`<div class="card dark-card"><div class="eyebrow" style="color:#d7f4e5">TRANSPORT SUBSCRIPTION</div><div class="row between mt"><div><div class="small" style="color:#d0e6df">Current balance</div><div class="money">${fmt(owed)}</div><div class="small" style="color:#cfefdf">${record?record.status+' enrollment':'No enrollment'}</div></div><span style="font-size:36px">🎫</span></div><div class="divider" style="background:#ffffff30"></div><button class="btn btn-white full" onclick="Cresto.nav('services')">Manage transport services →</button></div>`;
    }
    content+=`<div class="card"><div class="row between"><div><div class="eyebrow">SYSTEM STATUS</div><div class="bold mt">Standalone reference mode</div><div class="note mt">All data is fictional and saved only on this device. No live GPS, payments, Google Maps or server connections.</div></div><div style="font-size:30px">🔒</div></div></div>`;
    return content+'</main>';
  }
  function metric(label,value,icon,shrink=false){return `<div class="metric"><div class="row between"><span class="metric-label">${esc(label)}</span><span class="icon">${icon}</span></div><div class="metric-value" style="font-size:${shrink?'13':'24'}px;overflow-wrap:anywhere">${esc(value)}</div></div>`}
  const mapSvg=()=>{
    const pos=STOPS[Math.min(state.step,4)];
    const route=STOPS.map(p=>`${p.x},${p.y}`).join(' ');
    return `<div class="map" aria-label="Illustrative map of a fictional bus route"><div class="map-label">ILLUSTRATIVE MAP • NOT GPS</div><svg viewBox="0 0 390 237" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of five stops with bus at ${esc(pos.name)}">
      <rect width="390" height="237" fill="#e5f0e9"/><path d="M0 58 L390 58 M0 125 L390 125 M0 200 L390 200 M73 0 V237 M175 0 V237 M305 0 V237" stroke="#d0e3de" stroke-width="10" fill="none"/>
      <path d="M0 58 L390 58 M0 125 L390 125 M0 200 L390 200 M73 0 V237 M175 0 V237 M305 0 V237" stroke="#fafffb" stroke-width="6" fill="none"/>
      <path d="M18 12 Q82 35 122 17 T220 20 T390 15 M7 222 Q130 208 171 231 T390 223" fill="none" stroke="#b6d6cc" stroke-width="4" opacity=".7"/>
      <rect x="227" y="159" width="77" height="39" rx="7" fill="#cee6cd"/><text x="244" y="181" font-size="9" fill="#88aa8f">CITY PARK</text>
      <polyline points="${route}" stroke="#fff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    formPayment(ev){ev.preventDefault();if(!guard(isAdmin()))return;const id=document.getElementById('payUser').value,e=state.enrollments.find(x=>x.id===id);const amt=Number(document.getElementById('payAmount').value),due=e?Math.max(0,e.fee-e.paid):0;

    reset(){state=seed();save();close();flash('All sample data restored')},
    receipt(id){const p=state.payments.find(x=>x.id===id),e=p&&state.enrollments.find(x=>x.id===p.enrollment);if(!p||!e)return;const text=`CRESTO — SAMPLE PAYMENT RECEIPT\nNOT A REAL PAYMENT CONFIRMATION\nReceipt ID: ${p.id}\nPassenger: ${e.name}\nDate: ${p.date}\nAmount: ${fmt(p.amount)}\nMethod: ${p.method}\nRoute: ${state.route}\n\nReference app only — fictional data.`;this.download('CRESTO_Receipt_'+p.id+'.txt',text,'text/plain')},
    exportCsv(){if(!guard(isAdmin()))return;const row=[['Payment ID','Enrollment ID','Passenger','Amount INR','Recorded','Method'],...state.payments.map(p=>[p.id,p.enrollment,state.enrollments.find(e=>e.id===p.enrollment)?.name||'',p.amount,p.date,p.method])];const csv=row.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');this.download('CRESTO_Demo_Payments.csv',csv,'text/csv')},
    download(name,content,mime){if(window.CrestoAndroid&&typeof window.CrestoAndroid.exportText==='function'){window.CrestoAndroid.exportText(name,content);flash('Choose where to save the file');return}const blob=new Blob([content],{type:mime+';charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);flash('File export requested')}
  };
  save();render();
  setInterval(()=>{if(!state.trip||!state.simulate)return;state.step=(state.step+1)%STOPS.length;state.lastUpdate=CLOCK();save();if(state.tab==='track'||state.tab==='home')render()},9000);
  if(!window.CrestoAndroid && 'serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

</script>
