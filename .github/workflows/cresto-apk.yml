name: Build CRESTO Android APK
on:
  push:
    branches: [cresto-reference-apk-build]
    paths:
      - 'cresto-android/**'
      - '.github/workflows/cresto-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK platform
        run: |
          echo "SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)
          echo "SDK manager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' || test ${PIPESTATUS[1]} -eq 0
          fi
      - name: Build installable APK
        run: gradle -p cresto-android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRESTO-installable-APK
          path: cresto-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30