name: CRESTO GPS APK
on:
  push:
    branches: [cresto-gps-demo-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDK="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)"
          yes | "$SDK" --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null || true
          "$SDK" --sdk_root=/usr/local/lib/android/sdk 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CRESTO-GPS-Demo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
